[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "plan1-comparison"
version = "0.1.0"
description = "Assembles the penguin ↔ DeformSplat baseline comparison from archived run records under pre-registered rules"
requires-python = ">=3.11"   # tomllib
# The assembler and the saturation rule remain pure stdlib — the whole decision
# surface is testable with no third-party runtime. These three are the *method*'s
# dependencies: `arap_core` solves and reads and writes PLY, `box_b` assigns edge
# weights.
#
# EVERY BOUND BELOW IS A MAJOR-VERSION CEILING AND NOT A PIN, deliberately. A
# pinned wheel that stops being built turns a soft failure — "this was verified
# against 2.1.3, try it" — into an artefact nobody can install at all, and this
# repository is meant to still be checkable years after the last commit. The
# ceiling is where the risk actually is: a major version is where a library is
# allowed to remove what this code calls. The exact versions everything was
# verified against are recorded in `verified_environment.toml`, which documents
# rather than enforces, for the same reason.
dependencies = [
    "numpy>=2,<3",
    "scipy>=1.15,<2",
    "plyfile>=1,<2",
]

[project.optional-dependencies]
# torch is what the DEPLOYED cluster rule is written in, so the conformance test
# and the wiring harness both need it. It is a hard test dependency, not an
# optional nicety: without it those two modules used to skip, and they are the
# gate `plan1_verdict.md` §1 names as the precondition for making any claim.
# `matplotlib` draws the one figure this repository generates rather than vendors
# (scripts/make_projection_figure.py). It belongs HERE and not in `dependencies`:
# the claim above — that the decision surface is testable with no third-party
# runtime — has to stay true, and `verify.sh` installs `.[test]` so the green gate
# still gets it.
#
# `coverage` and `mypy` were both already in use and declared nowhere. The
# coverage measurement is what the claim-surface percentage in `README.md` rests
# on, and `mypy plan1 scripts` is the standard the section below states this
# repository holds itself to — neither could be reproduced from a fresh checkout.
test = [
    "pytest>=8,<9",
    "torch>=2,<3",
    "matplotlib>=3,<4",
    "coverage>=7,<8",
    "mypy>=1.14,<2",
]

[tool.setuptools]
packages = ["plan1", "arap_core", "box_b"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

# ── the claim surface ───────────────────────────────────────────────────────
# WHAT THIS LIST IS: the code whose coverage this repository makes a claim about.
# It is `plan1` (the assembler and the pre-registered rule), `box_b` (the B2
# seam), `arap_core` (the solver) and the worked example. Those four reach 100%,
# and `tests/test_coverage_surface.py` holds this list and that claim together.
#
# WHAT IS OUTSIDE IT, AND WHY THAT IS A REASON RATHER THAN AN EXCUSE:
# `scripts/`, `diagnostics/` and the mutation tool are not measured here.
# Everything that computes a published number is covered by tests. Everything
# that *generates an artefact* is covered by regenerate-and-diff — the gate
# rebuilds the comparison table and the figure's data record from scratch and
# fails on a single differing byte. That is a stricter check than line coverage,
# not a weaker one, because it constrains the output rather than the path taken
# to it.
#
# The example is the one member of the surface that neither computes a published
# number nor generates a diffed artefact, which is exactly why it is in: "does it
# still run?" was otherwise unchecked, and `README.md` quotes a number it printed.
[tool.coverage.run]
branch = true
source = ["plan1", "box_b", "arap_core", "examples"]

[tool.coverage.report]
show_missing = true
# 100 rather than a softer number, because the two lines that cannot be reached
# both carry a `# pragma: no cover` with the reason written beside it, and
# `tests/test_coverage_surface.py` fails on a marker that carries no reason. A
# threshold below 100 would let an unexplained gap open without anyone deciding
# to open it — which is the only thing a coverage number is good for.
fail_under = 100

[tool.mypy]
# `mypy plan1 scripts` is the standard this repository holds itself to, and it was
# clean only by accident: nothing under `scripts/` imported `arap_core`, so scipy
# and plyfile never entered the graph. The §6.4 figure script reads a PLY, they do
# now, and twelve `import-untyped` errors appeared without a line of this project's
# code being wrong.
#
# scipy, plyfile and matplotlib ship no type information at all — no stubs, no
# `py.typed`. Declaring that is not suppressing a defect; it is stating a fact about
# three third-party libraries, and it is scoped to exactly those three so that a
# genuine error anywhere else still fails.
[[tool.mypy.overrides]]
module = ["scipy.*", "plyfile.*", "matplotlib.*"]
ignore_missing_imports = true
