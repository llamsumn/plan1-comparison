# The rho = 32 and rho = 64 saturation runs are appended here once they land.
# The saturation rule currently reports NOT SATURATED, so no row may be
# published until they do (plan1_prereg.md §3.1).

# ── the baseline ────────────────────────────────────────────────────────────
# The authors' unmodified pipeline, 2026-07-22 spike. Recorded only as a console
# line, at display precision (3 / 4 / 3 decimals), so every fraction derived from
# it carries a rounding interval.
#
# If preflight recovers THIS RUN's stats/val_step0501.json from the cluster,
# change `kind` to "stats_json" and `path` to the run directory; the table then
# regenerates at full precision. plan1_prereg.md §7 governs what qualifies: the
# local ~/results/diva360_finetune/penguin_0217_0239/ (2026-06-24, 25.0107) is a
# DIFFERENT run and is disqualified.
[[row]]
key = "baseline"
label = "inferred groups (baseline, as published)"
role = "baseline"
information = "observed before/after motion"
kind = "console_log"
root = "archive"
path = "cluster/spike_logs/phase3_run_console.log"
