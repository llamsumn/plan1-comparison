# ── the baseline ────────────────────────────────────────────────────────────
# The authors' unmodified pipeline, 2026-07-22 spike. It was recorded only as a
# console line at display precision (3 / 4 / 3 decimals), and every fraction
# derived from it inherited a rounding interval.
#
# 2026-08-05: preflight recovered THIS RUN's own statistics record from the
# cluster — /homes/clll20/deformsplat/results/diva360_finetune/penguin_0217_0239/,
# mtime 2026-07-22 08:34, matching the spike. It qualifies under plan1_prereg.md
# §7: its values round to the console line exactly (25.054527 → 25.055,
# 0.95346910 → 0.9535, 0.05649951 → 0.056), and its step-0 triple is bit-identical
# to all eight sweep rows, so the comparability gate holds at full precision
# rather than at the console line's three decimals. The row is therefore bound to
# the statistics record and the rounding intervals collapse.
#
# The disqualified alternative is retained as a warning, not as a fallback: the
# local ~/results/diva360_finetune/penguin_0217_0239/ (2026-06-24, 25.0107) is a
# DIFFERENT run. Substituting it would be the prohibited baseline re-run by
# another route. The superseded console line remains at
# cluster/spike_logs/phase3_run_console.log.
[[row]]
key = "baseline"
label = "inferred groups (baseline, as published)"
role = "baseline"
information = "observed before/after motion"
kind = "stats_json"
root = "archive"
path = "cluster/rho_probe_evidence/baseline_penguin_0217_0239"
