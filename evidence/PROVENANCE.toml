# The vendored evidence base — what travelled, what it is, and what it hashes to.
#
# `plan1-comparison` used to resolve its evidence out of a checkout elsewhere on
# the authoring machine. That made the published table reproducible only inside one
# person's directory layout, and made three test modules skip silently everywhere
# else. The evidence is 1.7 MB — 236 KB of run records and cluster sources plus
# 1.5 MB of characterisation outputs — and it now lives here, with nothing outside
# this repository in the runtime graph at all.
#
# Vendoring trades away divergence detection: a copy cannot notice that its
# original changed. That trade is deliberate — Plan 1 is frozen (archived runs,
# fixed deployed text at a cited hash), so "notice if upstream moves" protects
# nothing about its claim, while self-containment is what an examiner needs. What
# keeps the trade honest is this file: every copied byte records what it is and
# what it hashes to, so anyone holding an original can audit the copy against it.
# `tests/test_vendored_evidence.py` asserts every row, in both directions — a file
# with no row fails just as loudly as a row that does not match its file.
#
# `origin` SAYS WHAT THE THING IS, NOT WHERE IT SAT. Each row used to record the
# absolute path the copy was reached at on the authoring machine — a directory on
# somebody else's computer, which a reader can neither resolve nor check. For 24 of
# the rows that path was character-identical to the file's own location here once
# the private prefix came off, so the prefix was the only content it carried.
# `origin` records the measurement instead: which run, which evaluation step, which
# study step, which document. That is self-contained, and it is what a reader
# actually needs in order to judge whether a file supports the sentence citing it.
# The hash is what makes the copy auditable, and it always was.

[vendoring]
# When the copies were taken. The bulk travelled on the first date; the two
# companion documents under `record/` followed on the second, when the citations
# inside the records they accompany were made to resolve. On the third, the second
# asset's seven run directories travelled — they had been excluded on the grounds
# that no manifest row bound them, and a manifest now does.
dates = ["2026-08-06", "2026-08-08", "2026-08-12"]

