# ── the archived cluster sources ────────────────────────────────────────────
# Both gate modules load these by AST out of the source *text*, so the binding is
# to the bytes below and not to a transcription of them. Copied, never edited.
#
# THESE TWO ARE THE ONLY THIRD-PARTY FILES IN THE EVIDENCE BASE. They are
# DeformSplat's, Apache-2.0, and both carry a local modification — so each row
# below adds `upstream_repo`, `upstream_commit`, `upstream_licence` and
# `modification` to the four fields every other row has.
#
# The licence asks that a modified file carry a notice saying it was modified, and
# these two cannot: `source` is hash-pinned above, the manifest cites the second
# hash directly, and `test_conformance.py` and `test_wiring_assertion.py` both
# parse the source text by AST. A licence header inserted into either file would
# break all four at once, and would also make the vendored copy stop being what
# ran on the cluster — which is the single property that makes it evidence.
#
# So the notice is carried beside the file rather than inside it: `THIRD_PARTY.md`
# states the modification, and `third_party/deformsplat/*.diff` commits the
# complete diff against the pinned upstream commit — 30 lines across the two,
# applying cleanly, guarded by `tests/test_upstream_diff.py`. A reader gets more
# than the licence asks for, and the copied bytes stay exactly as deployed.

