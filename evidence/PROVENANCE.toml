# ── the ported method ───────────────────────────────────────────────────────
# Everything below is *code*, not evidence, so it lives at the repository root
# where it can be imported rather than under `evidence/` where it would only be
# read. Same discipline, different home: source repository, source commit, and a
# hash for every file.
#
# Ported from `arap-deform-3dgs` at `ede5fd3a1dda0b69ddb38648c0c97a77021021b0`
# under #16. Before it, this repository could report that an asset had been
# deformed; after it, it can deform one — and the three places that resolved a
# sibling working tree (`tests/conftest.py`'s sys.path injection,
# `test_conformance.py`'s own resolve, and `build_table.py`'s METHOD_REPO plus
# its git-HEAD read) are all deleted. `plan1/provenance.py` no longer contains a
# function capable of reading a sibling checkout at all.
#
# **What deliberately did not come.** `box_b/descriptors.py` (348 lines),
# `box_b/noise.py` (229) and their 47 tests — the geometry reader, paused on a
# diagnosed shrinking-ball defect. It is the risk this repository exists to be
# safe from, and leaving it behind is the point rather than an omission.
