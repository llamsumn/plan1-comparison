# ── the solver diagnostic ───────────────────────────────────────────────────
# Ported from the *archive*, not from the method repository, under #17: the
# 40-rung ladder that drives `arap_core` end to end. Nothing in
# `arap-deform-3dgs`'s own suite touches `driver`, `global_step` or `local_step`,
# so before this the solver's entire evidence was one inline assertion in
# `run_penguin.py` plus a JSON file in an archive nobody ran.
# `tests/test_diagnostic.py` re-executes the six phases and compares all 40
# records field by field. It never calls `main()`, because `main()` calls
# `write_artifacts()`, and a test that rewrites the file it compares against is
# the tautology this whole ticket exists to avoid.
#
# **TWO OF THE THREE FILES DIVERGE FROM SOURCE, and the reason is a finding.**
# Re-running the ladder against the *ported* core, 39 of the 40 records
# reproduced bit-for-bit and one did not:
#
#   G5 "SH stub boundary" asserted `max|Δ sh[:, 1:, :]| == 0` — that spherical-
#   harmonic bands 1 and above are LEFT UNTOUCHED. That was a correct boundary
#   check on a deliberate limitation when it was written (2026-07-15), and it has
#   been wrong since B1 replaced the DC-only stub with real Wigner-D. Re-executed
#   here it fails at 6.35: the bands move, because they are supposed to.
#
# This is precisely what the ticket's "re-execute the ladder, do not re-read its
# answer" requirement was for — a committed JSON compared against itself would
# have reported 40/40 green and carried a check asserting the absence of a
# shipped feature. That the other 39 entries are bit-identical is what identifies
# it as an obsolete check rather than a regression in the port.
#
# G5 is rewritten in the vendored copy to ask the boundary question the real
# implementation has — DC invariant, bands 1+ demonstrably move, identity
# rotation a byte-exact no-op — with the original quoted at the call site. The
# JSON is regenerated from the ported core so the record describes the code this
# repository actually ships. `refs.py` is untouched.

