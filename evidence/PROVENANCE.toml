archive_first_date = "2026-08-05"
why = "the pre-registration. It declares the saturation rule, the comparability gate and the precision policy BEFORE the rows they select; `plan1/render.py` cites this path in the published table's byline, and until now cited one that shipped nowhere"
# TWO DATES, AND THE DIFFERENCE BETWEEN THEM IS THE POINT. `archive_date` is when
