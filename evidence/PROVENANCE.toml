# ── the method ──────────────────────────────────────────────────────────────
# Everything below is *code*, not evidence, so it lives at the repository root
# where it can be imported rather than under `evidence/` where it would only be
# read. Same discipline, different home: what the file is, and a hash for it.
#
# THESE ROWS NAME NO SOURCE REPOSITORY, AND THAT IS THE HONEST RECORD RATHER THAN
# A GAP. They used to name two of this author's own repositories and a commit in
# each. Neither is published, so the citation could not be followed, and there was
# nobody to attribute to in any case: the code is this project's own and this
# repository is now its only published home. What the rows are FOR survives intact
# — they are integrity pins. `tests/test_conformance.py` checks the reference
# rule's hash against the row below and against the published table's footer, so
# editing `box_b/edge_weights.py` fails the suite in three places at once. That is
# the part that did work; a commit id in a repository a reader cannot clone never
# did.
#
# Genuine third-party material is a different question and keeps its full
# attribution: see `upstream_repo` on the two cluster sources above, `attribution`
# on the sample asset below, and `THIRD_PARTY.md`.
#
# **What deliberately did not come.** `box_b/descriptors.py` (348 lines),
# `box_b/noise.py` (229) and their 47 tests — the geometry reader, paused on a
# diagnosed shrinking-ball defect. It is the risk this repository exists to be
# safe from, and leaving it behind is the point rather than an omission.

