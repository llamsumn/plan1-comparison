# ── provenance inputs that the footer names ─────────────────────────────────
# The published table's footer names three artefacts, and every one of them
# identifies content that is present in this repository: the reference rule, whose
# hash is taken from the ported file at the repository root, and the two cluster
# sources, whose hashes are taken from `evidence/`.
#
# A fourth row used to sit here — the HEAD commit of the repository the method was
# copied from. It named a 40-hex commit in a repository no reader can clone, so it
# published an identifier that could not be resolved and could not be checked. It
# is gone. The hash below is what actually pins the content, and always was.

