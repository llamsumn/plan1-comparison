# chapter cites has to be under version control with the artifact that publishes
# it, which is what these 21 files are.
#
# **Nothing here was regenerated.** The three verdicts assert against these exact
# bytes, at these exact row counts; re-running the generators would invalidate the
# assertions and force re-verification of work that is already green. Each row
# therefore carries `command` (how it was made), `generated` (when) and
