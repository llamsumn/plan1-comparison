path = "diagnostics/run_diagnostic.py"
origin = "authored for this project — the solver diagnostic ladder"
sha256 = "d1d2d688d60746d6ad254cd2455fab86550e1db9cf0cdfe1de591a5666183920"
why = "the 40-rung ladder: Laplacian properties, stationarity, the cantilever profile, boundary cases, numerics and the Gaussian carry. G5 is rewritten, reasoned above"

