# the runs. 2026-08-05 is the same day as the rho = 32 and rho = 64 runs, not the
# day after — so the earlier field removes the backwards reading the later one
# invites on its own. It still does not PROVE precedence: same-day granularity
# cannot, and neither field should be asked to. The proof is the test named above.

