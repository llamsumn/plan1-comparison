# ── the four documents the whole artefact argues from ───────────────────────
# THE FIRST TWO WERE CITED SIXTEEN TIMES AND SHIPPED ZERO — including in the
# published table's own byline, which told a reader to consult a path that does not
# exist in any repository they can reach. `plan1/render.py` now names the copy
# below.
#
# The pre-registration and the verdict are the only rows carrying `archive_commit`
# and `archive_date`, and the reason is that they are the only vendored files whose
# *identity as a document* matters rather than just their bytes. A
# `val_step0501.json` is its own evidence; a pre-registration is a claim about what
# was decided and when, so which revision of it travelled has to be answerable.
#
# READ THE DATE FOR WHAT IT IS. `2026-08-06` is when the archive commit these
# copies were taken from was made — the last commit touching either file. It is
# NOT the date the pre-registration was written, and it must not be read as
# precedence evidence: the rho = 32 and rho = 64 runs it licensed are dated
# 2026-08-05, one day EARLIER, and the verdict is a document that necessarily
# postdates the runs it judges.
#
# What actually carries precedence is behavioural and is already in this
# repository. `tests/test_saturation.py::test_archived_sweep_as_it_stands_is_not_saturated`
# applies the pre-registered rule to the sweep as it stood when the rule was
# written and asserts NOT SATURATED, continue at rho = 32. The rule forced two
# further cluster runs before anything could be published, and rho = 64 turned the
# curve over — so it could have moved the reported row, and demonstrably did move
# the work. A rule that only ever agreed with what was already there would be
# worth nothing; this one is on record disagreeing. Vendoring these documents adds
# the text. The test is what makes the text load-bearing.
#
# THE OTHER TWO ARE THE COMPANIONS THESE TWO CITE BY NAME. The pre-registration
# names the Phase-B probe verdict as the companion whose two carve-outs its §6
# exists to close; the verdict names the feasibility addendum as where "sources
# unchanged, so the evidence transfers" is checkable. Both were sibling-relative
# links into a directory a reader does not have, so both citations resolved
# nowhere. Placing the documents here is what makes them resolve — no link was
# rewritten and no pinned byte was touched.
#
# All four are copied VERBATIM, `../../` links and all. Several of those links
# point out of this repository and cannot resolve here. That is deliberate:
# rewriting a link would change the bytes, and then the sha256 below would no
# longer let anyone holding the original audit this copy against it — which is the
# single property that makes `evidence/` worth having. Every one of those links is
# classified instead, in `record/LINKS.md`, and
# `tests/test_vendored_record_links.py` fails if one is neither resolvable nor
# accounted for there.

