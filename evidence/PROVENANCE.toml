source_repo = "3D-arap"
source_commit = "2b362d617c3055a66996b9102c2e927957fd187b"
sha256 = "ad86ad03271a51b528ef8fd117316d4697b616d8fba501b306bb46feed7e1088"
why = "the 40-rung ladder: Laplacian properties, stationarity, the cantilever profile, boundary cases, numerics and the Gaussian carry. NOT byte-identical — G5 rewritten, reasoned above. Source hash at 2b362d61: 39bf9d84b07115b8…"

