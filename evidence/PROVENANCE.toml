# The vendored evidence base — what travelled, from where, and hashing to what.
#
# `plan1-comparison` used to resolve its evidence out of a sibling `~/3D`
# checkout. That made the published table reproducible only inside one person's
# directory layout, and made three test modules skip silently everywhere else.
# The evidence is 1.7 MB — 236 KB of run records and cluster sources (#15) plus
# 1.5 MB of characterisation outputs (#19) — and it now lives here, with `~/3D`
# out of the runtime graph entirely.
#
# Vendoring trades away divergence detection: a copy cannot notice that its
# original changed. That trade is deliberate — Plan 1 is frozen (archived runs,
# fixed deployed text at a cited hash), so "notice if upstream moves" protects
# nothing about its claim, while self-containment is what an examiner needs. What
# keeps the trade honest is this file: every copied byte records where it came
# from and what it hashes to, so anyone holding an original can audit the copy
# against it. `tests/test_vendored_evidence.py` asserts every row, in both
# directions — a file with no row fails just as loudly as a row that does not
# match its file.
#
# Sources are recorded as they were reached on the authoring machine. They are
# provenance, not a runtime path: nothing in this repository resolves them.

[origin]
archive = "~/3D"
vendored = "2026-08-06"
issues = [
  "https://github.com/llamsumn/3D-arap/issues/15",  # run records, cluster sources, logs
  "https://github.com/llamsumn/3D-arap/issues/19",  # characterisation outputs
  "https://github.com/llamsumn/3D-arap/issues/16",  # the method — see [[ported]]
  "https://github.com/llamsumn/3D-arap/issues/17",  # the solver diagnostic
]

